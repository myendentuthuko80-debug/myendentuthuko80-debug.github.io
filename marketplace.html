<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYENDE MARKET - eBay Style</title>
<style>
body{margin:0;font-family:Arial;background:#050a08;color:#fff}
header{background:rgba(0,0,0,0.8);padding:15px 4%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.logo{font-weight:800;font-size:1.5rem}
.search{flex:1;max-width:500px;margin:0 20px;display:flex}
.search input{flex:1;padding:12px;border-radius:30px 0 0 30px;border:none}
.search button{padding:12px 20px;border-radius:0 30px 30px 0;border:none;background:#d4a017;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px;padding:20px}
.card{background:#111;border:1px solid #333;border-radius:15px;padding:15px}
.btn{padding:10px 20px;border-radius:20px;border:none;background:#fff;color:#000;font-weight:bold;cursor:pointer}
.btn-gold{background:#d4a017}
</style>
</head>
<body>
<header>
<div class="logo">🛍️ MYENDE MARKET</div>
<div class="search"><input id="search" placeholder="Search anything..." oninput="render()"><button onclick="render()">Search</button></div>
<button class="btn btn-gold" onclick="openSell()">+ Sell</button>
</header>
<div style="padding:30px 4%;text-align:center"><h1>Everything - Auction & Buy Now</h1><p>eBay style for SA - Bid or Buy Instantly</p></div>
<div class="grid" id="grid"></div>

<div id="sellBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);place-items:center;z-index:99"><div style="background:#111;padding:20px;border-radius:15px;max-width:400px;width:90%"><h3>List Item</h3><input id="pTitle" placeholder="Title" style="width:100%;padding:10px;margin:5px 0"><input id="pPrice" type="number" placeholder="Price R" style="width:100%;padding:10px;margin:5px 0"><input id="pPhone" placeholder="WhatsApp number" style="width:100%;padding:10px;margin:5px 0"><button class="btn btn-gold" onclick="addProduct()" style="width:100%;margin-top:10px">List Now</button><button class="btn" onclick="document.getElementById('sellBox').style.display='none'" style="width:100%;margin-top:5px">Cancel</button></div></div>

<script>
let products=JSON.parse(localStorage.getItem('myende')||'[]');
if(products.length==0){products=[{id:1,title:'iPhone 13 - Boxed',price:8500,phone:'27123456789',emoji:'📱'},{id:2,title:'Jordan Shoes Size 8',price:2500,phone:'27123456789',emoji:'👟'},{id:3,title:'Toyota Corolla 2019',price:165000,phone:'27123456789',emoji:'🚗'}];localStorage.setItem('myende',JSON.stringify(products))}
function render(){let g=document.getElementById('grid');g.innerHTML='';let s=document.getElementById('search').value.toLowerCase();products.filter(p=>p.title.toLowerCase().includes(s)).forEach(p=>{g.innerHTML+=`<div class="card"><div style="font-size:3rem;text-align:center">${p.emoji}</div><h3>${p.title}</h3><p style="font-size:1.2rem;font-weight:bold;margin:10px 0">R${p.price}</p><button class="btn btn-gold" style="width:100%" onclick="buy(${p.id})">Buy on WhatsApp</button></div>`})}
function openSell(){document.getElementById('sellBox').style.display='grid'}
function addProduct(){let t=document.getElementById('pTitle').value;let pr=document.getElementById('pPrice').value;let ph=document.getElementById('pPhone').value;if(!t||!pr)return alert('Fill all');products.unshift({id:Date.now(),title:t,price:parseFloat(pr),phone:ph,emoji:'📦'});localStorage.setItem('myende',JSON.stringify(products));document.getElementById('sellBox').style.display='none';render()}
function buy(id){let p=products.find(x=>x.id==id);window.open(`https://wa.me/${p.phone}?text=Hi! I want ${p.title} for R${p.price} from MYENDE MARKET`)}
render();
</script>
</body>
</html>
